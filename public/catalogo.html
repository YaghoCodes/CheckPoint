<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/styles/styleCatalogo.css">
    <link rel="stylesheet" href="assets/styles/styleNavbar.css">
    <title>CheckPoint — Catálogo</title>
    <style>

    </style>
</head>

<body>

    <header>
        <div class="header-inner">
            <h1><span class="texto-azul">Check</span>Point</h1>
            <ul class="icones_nav">
                <li><a href="home.html">Home</a></li>
                <li><a href="catalogo.html" class="active">Catálogo</a></li>
                <li><a href="dashboard.html">Dashboard</a></li>
            </ul>
            <span id="colocarBotaoPerfil">
            <a class="profile-btn" aria-label="Meu perfil" href="perfil.html">
                <div class="profile-avatar" id="c_usuario">U</div>
                <span class="profile-name" id="n_usuario">username</span>
            </a>
            </span>
        </div>
    </header>

    <div class="catalogo-hero">
        <div class="catalogo-hero-wrapper">
            <div class="hero-label">// CATÁLOGO</div>
            <h2>Explore a biblioteca de <span class="texto-azul">jogos.</span></h2>
            <p>Clique em um jogo para ver detalhes e deixar sua review.</p>
            <div class="catalogo-controls">
                <input class="search-input" type="text" placeholder="Buscar jogos ou categorias..." id="busca"
                    oninput="filtrar()">
            </div>
        </div>
    </div>


    <div class="container-main">
        <div class="catalogo-grid" id="catalogo-grid"></div>
    </div>

    <script src="assets/scripts/sessao.js"></script>
    <script>
        plotarNavbar();
        validarSessaoCatalogo()
        
        async function renderizar() {

            const busca = document.getElementById("busca").value.toLowerCase();
            const grid = document.getElementById("catalogo-grid");

            if (busca.length > 0 && busca.length < 3) {
                grid.innerHTML =
                    `<div class="empty-state">Digite pelo menos 3 letras para buscar...</div>`;
                return;
            }
            let resposta;
            if (busca == "") {
                resposta = await fetch("/jogos/listar")
            } else {
                resposta = await fetch(`/jogos/buscar?nome=${busca}`)
            }

            const listaJogos = await resposta.json()

            if (listaJogos.length <= 0) {
                grid.innerHTML =
                    `<div class="empty-state">Nenhum Jogo Encontrado...</div>`;
                return;
            }

            console.log(listaJogos)


            grid.innerHTML = listaJogos.map(j => `
   <a href="jogo.html?id=${j.id}" class="game-card">
    <div class="game-card-cover"><img src="${j.imagem || '#'}" alt="${j.nome}"></div>

    <div class="game-card-info">
        <div class="game-card-name">${j.nome}</div>
        <div class="game-card-genre">${j.genero[0]} ${j.genero[1] ? j.genero[1] : ""}</div>
    </div>
</a>`
            ).join("");
        }

        let timeout;

        function filtrar() {
            clearTimeout(timeout);

            timeout = setTimeout(() => {
                renderizar();
            }, 400);
        }

        renderizar();
    </script>
</body>

</html>
